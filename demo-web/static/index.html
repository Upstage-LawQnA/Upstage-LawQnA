<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민원을 잇다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#16233d; --navy2:#1d2e4f; --navy3:#22355a; --line:#e6e2da; --bg:#f7f5f1; --card:#fff;
  --ink:#1b2333; --sub:#5b6474; --mute:#8a93a3; --orange:#e8681a; --orange2:#c9550c; --orange-bg:#fff3ea;
  --green:#1f8a5b; --green-bg:#e8f6ef; --blue:#2463c9; --blue-bg:#eaf1fd; --amber:#b26a00; --amber-bg:#fff4dc;
  --gray-bg:#eef0f3; --red:#c43b3b; --red-bg:#fdecec; --purple:#7046c2; --purple-bg:#f1ecfb; --teal:#0f7f86; --teal-bg:#e4f5f6;
  --radius:16px; --shadow:0 6px 24px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* header */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.06);transition:transform .25s ease}
header.hide{transform:translateY(-100%)}
header .wrap{display:flex;align-items:center;height:72px;gap:36px;max-width:1240px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--orange);font-style:normal;font-size:16px}
nav.main{display:flex;gap:30px;font-weight:600;font-size:15.5px}
nav.main a{opacity:.92;padding:6px 0;border-bottom:2px solid transparent}
nav.main a.on{opacity:1;border-color:var(--orange)}
.mode{margin-left:auto;display:flex;gap:6px}
.mode button{padding:9px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.35);font-weight:700;font-size:14.5px}
.mode button.on{background:#fff;color:var(--navy);border-color:#fff}
.menu-btn{display:none;margin-left:auto;font-size:24px}

/* hero */
.hero{background:radial-gradient(1200px 500px at 70% 30%,#24395f 0%,var(--navy) 60%);color:#fff;position:relative;overflow:hidden}
.hero .map{position:absolute;right:max(2%,calc(50% - 600px));top:24px;width:440px;height:420px;opacity:.6;pointer-events:none}
.hero .map path{fill:#2a4372;fill-rule:evenodd;stroke:#4a6699;stroke-width:1.1;vector-effect:non-scaling-stroke;transition:fill .2s ease}
.hero .map path.on{fill:var(--orange);stroke:#ffb27a}
.hero .map circle{fill:#4a6699}
.hero .wrap{position:relative;padding:96px 24px 86px;text-align:center}
.hero h1{margin:0;font-size:56px;line-height:1.22;font-weight:800;letter-spacing:-.045em}
.hero h1 .pin{display:inline-block;width:40px;height:40px;border-radius:50%;border:2px solid var(--orange);position:relative;vertical-align:top;margin-left:-6px;transform:translateY(-14px)}
.hero h1 .pin:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--orange)}
.hero p.lead{margin:26px 0 34px;font-size:18px;opacity:.88}
.searchbar{max-width:820px;margin:0 auto;background:#fff;border-radius:40px;display:flex;align-items:center;padding:8px;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.region-pill{display:flex;align-items:center;gap:6px;background:#f1f2f4;color:var(--ink);border-radius:30px;padding:12px 16px;font-weight:700;font-size:15px;white-space:nowrap;position:relative}
.region-pill svg{flex:none}
.region-pill select{position:absolute;inset:0;opacity:0;cursor:pointer}
.searchbar .q{flex:1;display:flex;align-items:center;gap:10px;color:var(--mute);min-width:0}
.searchbar input{flex:1;border:0;outline:0;font-size:17px;color:var(--ink);background:transparent;min-width:0}
.go{width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none;transition:.15s}
.go:hover{background:var(--orange2)}
.pinned{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:7px 12px;border-radius:20px;font-size:14px}
.pinned button{opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:28px}
.chips span.lbl{font-size:14.5px;opacity:.8;margin-right:4px}
.chip{border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:9px 18px;font-weight:700;font-size:15px;transition:.15s}
.chip:hover{background:rgba(255,255,255,.1)}
.hero-actions{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:40px;flex-wrap:wrap}
.btn-white{background:#fff;color:var(--navy);border-radius:28px;padding:15px 26px;font-weight:800;font-size:15.5px}
.link-u{font-weight:700;text-decoration:underline;text-underline-offset:5px;font-size:15.5px}
.strip{background:var(--orange2);color:#fff;text-align:center;font-weight:700;font-size:15px;padding:15px 16px;display:block}
.strip:hover{background:#b54b08}

/* sections */
section.block{padding:64px 0 24px}
section.block h2{font-size:31px;margin:0 0 10px;letter-spacing:-.04em}
section.block h2 em{font-style:normal;color:var(--orange2)}
section.block p.desc{color:var(--sub);margin:0 0 30px;font-size:16px}
.laws{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px}
.law{border-top:2px solid var(--line);padding:24px 0 30px}
.law .tag{font-size:13.5px;font-weight:800}
.law h3{font-size:21px;margin:8px 0 10px;line-height:1.4;letter-spacing:-.03em}
.law .eff{color:var(--sub);font-size:15px;margin-bottom:12px}
.law button,.law .law-go{color:var(--orange2);font-weight:800;font-size:15.5px}
.law .law-go:hover{text-decoration:underline}
.more{display:flex;justify-content:flex-end;margin-top:6px}
.more a{color:var(--orange2);font-weight:800}
.skel{background:linear-gradient(90deg,#ece9e3,#f6f4f0,#ece9e3);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:18px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.channel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 24px 28px;transition:.15s}
.channel:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.channel .ic{width:50px;height:50px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff;margin-bottom:22px}
.channel h3{margin:0 0 12px;font-size:21px}
.channel p{color:var(--sub);margin:0 0 18px;line-height:1.6;font-size:15px}
.channel b{color:var(--orange2);font-size:15px}
footer{background:var(--navy);color:#fff;margin-top:90px}
footer .wrap{display:flex;justify-content:space-between;align-items:flex-end;padding:40px 24px;gap:20px;flex-wrap:wrap;max-width:1240px}
footer b{font-size:18px}
footer p{margin:6px 0 0;opacity:.85;font-size:14px}
footer .r{text-align:right;font-size:14px;opacity:.85;line-height:1.8}

/* floating rail */
.rail{position:fixed;right:18px;top:50%;transform:translateY(-30%);background:var(--navy);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:2px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.rail a,.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11.5px;font-weight:700;padding:12px 8px;border-radius:12px;width:66px;text-align:center;line-height:1.25}
.rail a:hover,.rail button:hover{background:rgba(255,255,255,.08)}
.rail .hot{background:var(--orange)}
.rail .hot:hover{background:var(--orange2)}
.rail hr{border:0;border-top:1px solid rgba(255,255,255,.15);margin:4px 8px}

/* page views */
.page{padding:44px 0 20px;min-height:60vh}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:30px;letter-spacing:-.04em}
.page-head p{margin:6px 0 0;color:var(--sub)}
.subbar{background:var(--navy);padding:22px 0}
.subbar .searchbar{max-width:none;box-shadow:none}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.qbubble{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.qbubble .who{width:40px;height:40px;border-radius:50%;background:var(--gray-bg);display:grid;place-items:center;flex:none;font-weight:800;color:var(--sub)}
.qbubble .txt{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 18px;font-size:17px;font-weight:600}
.qbubble .meta{font-size:13px;color:var(--mute);margin-top:6px}
.steps{display:flex;gap:10px;margin:8px 0 22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:24px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mute)}
.step .dot{width:9px;height:9px;border-radius:50%;background:#cfd3da}
.step.run{color:var(--ink);border-color:var(--orange)}
.step.run .dot{background:var(--orange);animation:pulse 1s infinite}
.step.ok{color:var(--green)}
.step.ok .dot{background:var(--green)}
@keyframes pulse{50%{opacity:.3}}
.found-laws{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 20px}
.found-laws span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;color:var(--sub)}
.found-laws span b{color:var(--ink);font-weight:700}
.answer-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;padding:6px 12px;border-radius:20px}
.t-simple{background:var(--green-bg);color:var(--green)}
.t-complex{background:var(--blue-bg);color:var(--blue)}
.t-gray{background:var(--amber-bg);color:var(--amber)}
.t-no_basis{background:var(--gray-bg);color:#4a5262}
.t-related{background:#e8f0fb;color:#2463c9}
.t-handoff,.t-field,.t-proposal,.t-business{background:var(--orange-bg);color:var(--orange2)}
.t-review{background:var(--amber-bg);color:var(--amber)}
.t-gu{background:var(--gray-bg);color:#4a5262}
.review-note{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;margin:16px 0 0;line-height:1.6}
.t-national{background:var(--gray-bg);color:#4a5262}
.type-desc{color:var(--sub);font-size:14.5px;margin:10px 0 0}
.ans{font-size:19px;line-height:1.75;margin:20px 0 6px;font-weight:500;white-space:pre-wrap}
.ans.none{color:var(--sub);font-size:17px}
.ai-note{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-top:14px}
.ev-title{font-size:16px;font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.ev{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
.ev-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer}
.ev-head .lb{font-weight:800;font-size:15.5px}
.ev-head .lb small{display:block;color:var(--mute);font-weight:600;font-size:12.5px;margin-top:3px}
.ev-head .chev{transition:.2s;color:var(--mute)}
.ev.open .chev{transform:rotate(180deg)}
.exprs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.ex{font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:12px;position:relative;cursor:help}
.ex[data-n="의무"]{background:var(--red-bg);color:var(--red)}
.ex[data-n="재량"]{background:var(--blue-bg);color:var(--blue)}
.ex[data-n="금지"]{background:#fbe3e3;color:#9d2121}
.ex[data-n="노력 의무"]{background:var(--amber-bg);color:var(--amber)}
.ex[data-n="예외(단서)"]{background:var(--purple-bg);color:var(--purple)}
.ex[data-n="준용"]{background:var(--gray-bg);color:#4a5262}
.ex[data-n="위임"]{background:var(--teal-bg);color:var(--teal)}
.ex:hover:after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);background:var(--navy);color:#fff;font-weight:500;font-size:12.5px;padding:8px 10px;border-radius:8px;width:230px;z-index:5;line-height:1.5}
.ev-body{display:none;border-top:1px solid var(--line);padding:16px;background:#fbfaf8;font-size:14.5px;line-height:1.75;white-space:pre-wrap;max-height:420px;overflow:auto}
.ev.open .ev-body{display:block}
.ev-body table{border-collapse:collapse;font-size:13px;white-space:normal;margin:6px 0}
.ev-body td,.ev-body th{border:1px solid #ddd;padding:4px 7px;vertical-align:top}
.ev-foot{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.ev-foot a{color:var(--orange2);font-weight:700}
.side .card{padding:22px}
.side h4{margin:0 0 12px;font-size:15px}
.dept{display:flex;gap:12px;align-items:center}
.dept .ic{width:44px;height:44px;border-radius:12px;background:var(--orange-bg);color:var(--orange2);display:grid;place-items:center;flex:none}
.dept b{display:block;font-size:16px}
.dept small{color:var(--sub)}
.guess{display:inline-block;font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:2px 7px;margin-top:6px;font-weight:700}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:12px;padding:14px 18px;font-weight:800;font-size:15.5px;transition:.15s;width:100%}
.btn.pri{background:var(--orange);color:#fff}
.btn.pri:hover{background:var(--orange2)}
.btn.sec{background:#fff;border:1px solid var(--line)}
.btn.sec:hover{border-color:#c9c4ba}
.btn.navy{background:var(--navy);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.stack{display:flex;flex-direction:column;gap:10px}
.why{font-size:13.5px;color:var(--sub);line-height:1.6;margin:12px 0 0}
.tl{display:flex;gap:0;margin:14px 0 4px}
.tl div{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mute);position:relative;padding-top:18px}
.tl div:before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;border-radius:50%;background:#d6dae1;transform:translateX(-50%);z-index:1}
.tl div:after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:#d6dae1}
.tl div:first-child:after{display:none}
.tl div.on{color:var(--ink)}
.tl div.on:before{background:var(--orange)}
.tl div.on:after{background:var(--orange)}
.mini-laws{margin:0;padding:0;list-style:none;font-size:13.5px}
.mini-laws li{padding:8px 0;border-top:1px dashed var(--line)}
.mini-laws li:first-child{border-top:0}
.mini-laws a{font-weight:700}
.mini-laws small{color:var(--mute)}
.masked{font-size:13px;background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-weight:600}

/* compare */
.region-picks{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.rp{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px}
.rp.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[hidden]{display:none!important}
.pick-mode{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;margin:16px 0 2px;background:#fff}
.pick-mode button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer}
.pick-mode button.on{background:var(--navy);color:#fff}
.pick-mode button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.mp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.mp-sel{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:200px;align-items:center;font-size:14px;color:var(--sub)}
.mp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--orange-bg);color:var(--orange2);border-radius:20px;padding:5px 8px 5px 12px;font-weight:700;font-size:14px}
.mp-chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:50%}
.mp-chip button:hover{background:#fde0cc}
.mp-find{position:relative;width:240px;max-width:100%}
.mp-find input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14.5px;background:#fff}
.mp-find input:focus{outline:2px solid var(--orange);outline-offset:0}
.mp-sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(22,35,61,.12);z-index:5;display:none;max-height:260px;overflow:auto}
.mp-sugg button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 12px;font-size:14.5px;text-align:left;cursor:pointer}
.mp-sugg button:hover,.mp-sugg button:focus-visible{background:var(--orange-bg);outline:none}
.mp-sugg small{color:var(--mute)}
.mp-wrap{position:relative;height:520px;background:#fbfaf8;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#rmap{width:100%;height:100%;display:block;touch-action:manipulation}
#rmap path{vector-effect:non-scaling-stroke;transition:fill .15s ease}
#rmap path:focus{outline:none}
#rmap path:focus-visible{stroke:var(--orange);stroke-width:3}
.rm-sido{fill:#e6e3dd;fill-rule:evenodd;stroke:#fff;stroke-width:1.2;cursor:pointer}
.rm-sido:hover{fill:#f6dcc9}
.rm-sido.sel{fill:var(--orange)}
.rm-sido.sel:hover{fill:var(--orange2)}
.rm-hi{fill:none;stroke:var(--orange);stroke-width:2;pointer-events:none;display:none}
.rm-hi.on{display:inline}
.rm-lab{--u:1;font-size:calc(13px * var(--u));font-weight:800;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:calc(3px * var(--u));stroke-linejoin:round}
.rm-lab.on{fill:#fff;stroke:var(--orange2)}
.rm-dok{fill:var(--mute);pointer-events:none}
.rm-tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);display:none;z-index:3}
.mp-hint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--sub);margin:0;max-width:300px}
.mp-hint.warn{color:var(--orange2);border-color:var(--orange)}
.mp-src{font-size:12px;color:var(--mute);margin:8px 2px 0}
@media (max-width:640px){.mp-wrap{height:380px}.mp-find{width:100%;order:-1}.mp-hint{font-size:12px}}
.cmp-grid{display:grid;gap:16px;margin-top:20px}
.cmp-col{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.cmp-col h3{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.yes{color:var(--green);background:var(--green-bg)}
.no{color:#4a5262;background:var(--gray-bg)}
.summary{background:var(--orange-bg);border:1px solid #f6d3b9;border-radius:14px;padding:16px 18px;font-weight:600;margin-top:20px}

/* tickets */
.tk-list{display:flex;flex-direction:column;gap:10px}
.tk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.12s}
.tk:hover{border-color:#cfc8bb}
.tk.sel{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-bg)}
.tk .row1{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.tk h4{margin:6px 0 6px;font-size:16px}
.st{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:10px}
.st-기관지정{background:var(--blue-bg);color:var(--blue)}
.st-담당자처리중{background:var(--amber-bg);color:var(--amber)}
.st-답변완료{background:var(--green-bg);color:var(--green)}
.st-민원등록{background:var(--gray-bg);color:#4a5262}
.officer{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--mute);font-weight:700}

.issues{margin:0;padding-left:20px;line-height:1.7}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:140px;resize:vertical;outline:0;background:#fff;line-height:1.6}

input.f,select.f{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:0;background:#fff}
label.fl{display:block;font-weight:700;font-size:14px;margin:16px 0 8px}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-weight:700;font-size:15px;margin-bottom:18px}

.lawmeta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--sub);font-size:15px}
.lawmeta b{color:var(--ink);font-weight:700}
.lawgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start;margin-top:22px}
.lawask{display:flex;gap:8px;margin-top:6px}
.lawask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;background:#fff}
.lawask input:focus{outline:2px solid var(--orange);outline-offset:1px}
.lawask button{flex:none;width:auto;padding:14px 20px}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.art{text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;transition:.15s;cursor:pointer}
.art:hover,.art:focus-visible{border-color:var(--orange);outline:none}
.art b{display:block;font-size:13.5px;color:var(--orange2)}
.art span{font-size:15px;font-weight:600}
.reason{white-space:pre-wrap;font-size:15px;line-height:1.75;color:var(--ink);margin:0;max-height:420px;overflow:auto}
.hint2{color:var(--sub);font-size:14.5px;margin:6px 0 0}
@media (max-width:860px){.lawgrid{grid-template-columns:1fr}.lawhead h1{font-size:24px}}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}

/* modal */
.modal{position:fixed;inset:0;background:rgba(12,18,30,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:30px}
.modal h3{margin:0 0 6px;font-size:23px}
.modal .x{float:right;font-size:22px;color:var(--mute)}
.bundle{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:14px;margin-top:16px;line-height:1.7}
.bundle b{display:block;margin-bottom:4px}
.done-no{font-size:26px;font-weight:800;color:var(--orange2);margin:10px 0}

/* guide */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 10px}
.flow div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 14px}
.flow b{display:block;color:var(--orange2);font-size:13px;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:14.5px}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.6}
.tbl th{background:#f3f1ec;font-size:13.5px}
.g-sec{margin:44px 0 0}
.g-sec h2{font-size:23px;margin:0 0 6px}
.g-sec p{color:var(--sub);margin:0 0 16px}
.notice{background:#fff;border-left:4px solid var(--orange);padding:16px 18px;border-radius:8px;color:var(--sub);line-height:1.7;margin-top:30px}

@media (max-width:980px){
  .laws{grid-template-columns:repeat(2,1fr)}
  .channels{grid-template-columns:repeat(2,1fr)}

  .flow{grid-template-columns:repeat(2,1fr)}
  .rail{display:none}
}

  header.open .mode{display:flex;position:absolute;top:calc(72px + 196px);left:24px}

  .hero p.lead{font-size:15.5px}
  .hero .map{width:300px;height:290px;right:-80px;opacity:.35}
  .searchbar{flex-wrap:wrap;border-radius:22px}

  .laws,.channels{grid-template-columns:1fr}
  section.block h2{font-size:25px}
  .card{padding:20px}
  .ans{font-size:17px}
  .flow{grid-template-columns:1fr}
}

<body>
<header id="hdr">
  <div class="wrap">
    <a class="logo" href="#/"><i>민</i>민원을 잇다</a>
    <nav class="main">
      <a href="#/" data-nav="home">질문하기</a>
      <a href="#/compare" data-nav="compare">지역 비교</a>
      <a href="#/ticket" data-nav="ticket">민원 작성</a>
      <a href="#/guide" data-nav="guide">이용 안내</a>
    </nav>

      <button data-mode="citizen" class="on">시민</button>

</header>

<main id="view"></main>

<nav class="rail" id="rail" aria-label="빠른 이동"></nav>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<footer>
  <div class="wrap">
    <div><b>민원을 잇다</b><p>업스테이지 공공 법령 Q&amp;A 해커톤 출품작 · 시연용</p></div>
    <div class="r">조례 원문 출처 국가법령정보센터(법제처 OPEN API)<br>AI 답변은 참고용이에요. 공식 답변이 필요하면 지역 민원 창구·국민신문고를 이용하세요</div>
  </div>
</footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = { region: store.get("region", "서울특별시"), regions: [], pinned: null, last: null };
const POPULAR = [["경차 주차 할인", "경차는 공영주차장 요금이 할인되나요?"], ["임산부 주차구역", "임산부 전용주차구역은 누가 이용할 수 있나요?"],
  ["청년 나이 기준", "청년 기본 조례에서 말하는 청년은 몇 살부터 몇 살까지인가요?"], ["버스정류장 금연", "버스정류장에서 담배를 피우면 과태료가 얼마인가요?"]];
const TAG_COLOR = {"주차":"#c9550c","금연":"#1f8a5b","동물":"#7046c2","자전거":"#2463c9","공원":"#0f7f86","청년":"#c43b3b","교통":"#2463c9","복지":"#b26a00","환경":"#1f8a5b","세금·요금":"#5b6474","문화":"#7046c2"};
const STEP_NAMES = ["민원등록", "기관지정", "담당자처리중", "답변완료"];
const ICON = {
  pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8681a" stroke-width="2.4"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>',
  dept: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>',
  info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  book: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>',
};
const KOREA = `<svg class="map" id="heroMap" viewBox="-10 -10 1040 960" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>`;
/* 메인 배경 지도: 지역 비교와 같은 시·도 경계(통계청 SGIS 기반). 고른 지역만 주황으로 */
let HERO_MAP = null;
async function drawHeroMap() {
  const svg = $("#heroMap"); if (!svg) return;
  if (!HERO_MAP) { try { HERO_MAP = await api("/region_map.json"); } catch { return; } }
  if (!$("#heroMap")) return;
  svg.setAttribute("viewBox", `-10 -10 ${HERO_MAP.w + 40} ${HERO_MAP.h + 20}`);
  svg.innerHTML = HERO_MAP.sido.map(x => `<path d="${x.d}" data-n="${esc(x.n)}" class="${x.n === state.region ? "on" : ""}"/>`).join("")
    + (HERO_MAP.dokdo ? `<circle cx="${HERO_MAP.dokdo[0]}" cy="${HERO_MAP.dokdo[1]}" r="4"/>` : "");
}
function paintHeroMap() { document.querySelectorAll("#heroMap path").forEach(p => p.classList.toggle("on", p.dataset.n === state.region)); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function regionOptions(sel) {
  let html = "", group = "";
  for (const r of state.regions) {
    if (r.group !== group) { if (group) html += "</optgroup>"; html += `<optgroup label="${esc(r.group)}">`; group = r.group; }
    html += `<option ${r.name === sel ? "selected" : ""}>${esc(r.name)}</option>`;
  }
  return html + (group ? "</optgroup>" : "");
}
function shortRegion(r) { return r.replace(/^서울특별시 /, "서울 "); }
function setRegion(r) { state.region = r; store.set("region", r); }
function searchBar(value = "") {
  return `<form class="searchbar" id="askForm">
    <label class="region-pill">${ICON.pin}<span id="regionName">${esc(shortRegion(state.region))}</span>${ICON.down}
      <select id="regionSel" aria-label="지역 선택">${regionOptions(state.region)}</select></label>
    <div class="q">${ICON.search}<input id="qInput" autocomplete="off" placeholder="예) 경차는 공영주차장 요금이 할인되나요?" value="${esc(value)}"></div>
    <button class="go" aria-label="질문하기">${ICON.up}</button></form>`;
}
function bindSearch(onRegion) {
  $("#regionSel").addEventListener("change", e => { setRegion(e.target.value); $("#regionName").textContent = shortRegion(state.region); onRegion && onRegion(); });
  $("#askForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#qInput").value.trim(); if (q) goAsk(q); });
}
function goAsk(q, law) {
  const p = new URLSearchParams({ q, r: state.region });
  if (law || state.pinned) p.set("law", law || state.pinned);
  location.hash = "#/ask?" + p.toString();
}

/* ---------- home ---------- */
function viewHome() {
  $("#view").innerHTML = `
  <section class="hero">${KOREA}
    <div class="wrap">
      <h1>우리 동네 조례,<br>무엇이든 물어보세요</h1>

  </div></section>

    <h2>공식 답변이 필요하면</h2>

    <div class="channels" id="channels">${channelsHTML()}</div>

  bindSearch(() => { loadRecent(); $("#channels").innerHTML = channelsHTML(); paintHeroMap(); });
  drawHeroMap();
  $("#view").querySelectorAll(".chip").forEach(b => b.onclick = () => goAsk(b.dataset.q));
  renderPinned();
  loadRecent();
}

function stepState(i, st) { const el = $("#st" + i); if (el) el.className = "step " + st; }
async function runAsk(q, law) {
  const t0 = Date.now();
  let res;
  try {
    res = await fetch("/api/ask/stream", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, region: state.region, law: law || null }) });
  } catch { return showError("서버에 연결하지 못했어요."); }
  if (!res.ok || !res.body) return showError("질문을 처리하지 못했어요.");
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line) handleEvent(JSON.parse(line), t0);
    }
  }
}
function handleEvent(ev, t0) {
  if (ev.stage === "triage") {
    stepState(0, "ok"); stepState(1, "run");
    if (ev.masked && ev.masked.length) $("#result").insertAdjacentHTML("beforebegin", `<div class="masked">개인정보(${esc(ev.masked.join(", "))})는 가린 뒤 처리했어요.</div>`);
    if (ev.normalized) $("#result").insertAdjacentHTML("beforebegin", `<div class="masked" style="background:var(--blue-bg);color:var(--blue)">'${esc(ev.normalized)}'(이)라는 질문으로 이해하고 답할게요.</div>`);
  } else if (ev.stage === "laws") {
    stepState(1, "ok"); stepState(2, "run");
    $("#foundLaws").innerHTML = ev.laws.length ? `<div class="found-laws">${ev.laws.map(l => `<span><b>${esc(l.name)}</b></span>`).join("")}</div>` : "";
  } else if (ev.stage === "answer") {
    stepState(2, "ok"); state.last = ev; renderAnswer(ev);
  } else if (ev.stage === "error") showError(ev.message);
}

function fmtDate(d) { return d ? d.replace(/-/g, ".") : ""; }

function mdTables(text) {
  const out = []; let tbl = [];
  const flush = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|\s*-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    out.push("<table>" + rows.map((r, i) => "<tr>" + r.map(c => `<${i ? "td" : "th"}>${esc(c)}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>");
    tbl = [];
  };
  for (const line of text.split("\n")) { if (/^\s*\|/.test(line)) tbl.push(line.trim()); else { flush(); out.push(esc(line)); } }

}

function timeline(status) {
  const k = STEP_NAMES.indexOf(status);
  return `<div class="tl">${STEP_NAMES.map((s, i) => `<div class="${i <= k ? "on" : ""}">${s}</div>`).join("")}</div>`;
}

/* ---------- compare ---------- */
function viewCompare(params) {
  const q0 = params.get("q") || "";
  const valid = new Set(state.regions.map(r => r.name));
  const picks = new Set(store.get("cmpRegions", ["서울특별시", "부산광역시"]).filter(r => valid.has(r)));
  $("#view").innerHTML = `<div class="page"><div class="wrap">
    <div class="page-head"><div><h1>지역 비교</h1><p>같은 질문을 여러 지역의 조례로 찾아 나란히 보여 드려요. 2~4개 지역을 골라 주세요.</p></div></div>
    <div class="card">
      <form id="cmpForm" class="searchbar" style="box-shadow:none;border:1px solid var(--line);max-width:none">
        <div class="q" style="padding-left:14px">${ICON.search}<input id="cmpQ" value="${esc(q0)}" placeholder="예) 임산부는 공영주차장 요금을 감면받나요?"></div>
        <button class="go" aria-label="비교하기">${ICON.up}</button></form>
      <div class="pick-mode" role="group" aria-label="지역 고르는 방법"><button type="button" data-m="list">목록으로 고르기</button><button type="button" data-m="map">지도로 고르기</button></div>
      <div class="region-picks" id="picks"></div>
      <div id="pickMap" hidden>
        <div class="mp-bar"><div class="mp-sel" id="mpSel" aria-live="polite"></div>
          <div class="mp-find"><input id="mpFind" type="search" placeholder="지역 이름으로 찾기 (예: 부산, 전북)" aria-label="지역 이름으로 찾기" autocomplete="off"><div class="mp-sugg" id="mpSugg" role="listbox"></div></div></div>
        <div class="mp-wrap" id="mpWrap"><svg id="rmap" role="group" aria-label="대한민국 시·도 지도. 시·도를 누르면 비교할 지역으로 고르거나 풀어요." preserveAspectRatio="xMidYMid meet"></svg>
          <div class="rm-tip" id="rmTip"></div><p class="mp-hint" id="mpHint">비교할 시·도를 지도에서 눌러 주세요. 2~4개까지 고를 수 있어요.</p></div>
        <p class="mp-src" id="mpSrc">지도 불러오는 중…</p>
      </div>
      <p style="font-size:13px;color:var(--mute);margin:8px 0 0">지역마다 조례를 새로 받아 오면 처음엔 시간이 조금 더 걸려요.</p>
    </div>
    <div id="cmpOut"></div></div></div>`;
  // 목록·지도 어느 쪽에서 골라도 같은 picks를 씀 (최대 4개)
  const toggle = n => {
    if (picks.has(n)) picks.delete(n);
    else if (picks.size >= 4) { mapHint("최대 4개까지 고를 수 있어요. 다른 지역을 먼저 빼 주세요.", true); return; }
    else picks.add(n);
    store.set("cmpRegions", [...picks]); drawPicks(); paintMap();
  };
  const drawPicks = () => {
    $("#picks").innerHTML = state.regions.map(r => `<button type="button" class="rp ${picks.has(r.name) ? "on" : ""}" data-r="${esc(r.name)}">${esc(r.name)}</button>`).join("");
    $("#picks").querySelectorAll("button.rp").forEach(b => b.onclick = () => toggle(b.dataset.r));
  };
  const mapHint = (t, warn) => { const h = $("#mpHint"); if (h) { h.textContent = t; h.classList.toggle("warn", !!warn); } };
  let MAPD = null, mapVB = null;
  const shortOf = n => (MAPD && (MAPD.sido.find(x => x.n === n) || {}).s) || n;
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const LABEL_FIX = { "경기도": [378, 218], "인천광역시": [260, 205], "충청남도": [295, 373] };
  const scaleLabels = () => { const svg = $("#rmap"); if (!svg || !mapVB) return; const sc = Math.min((svg.clientWidth || 600) / mapVB[2], (svg.clientHeight || 520) / mapVB[3]); svg.querySelectorAll(".rm-lab").forEach(t => t.style.setProperty("--u", (1 / sc).toFixed(4))); };
  function paintMap() {
    if (!MAPD) return;
    document.querySelectorAll("#rmap .rm-sido").forEach(p => { const on = picks.has(p.dataset.n); p.classList.toggle("sel", on); p.setAttribute("aria-pressed", on); });
    document.querySelectorAll("#rmap .rm-lab").forEach(t => t.classList.toggle("on", picks.has(t.dataset.n)));
    const sel = [...picks];
    $("#mpSel").innerHTML = sel.length ? `<span>고른 지역 ${sel.length}/4</span>` + sel.map(n => `<span class="mp-chip">${esc(shortOf(n))}<button type="button" data-r="${esc(n)}" aria-label="${esc(n)} 빼기">✕</button></span>`).join("") : `<span>아직 고른 지역이 없어요</span>`;
    $("#mpSel").querySelectorAll("button[data-r]").forEach(b => b.onclick = () => toggle(b.dataset.r));
    if (sel.length < 2) mapHint("비교할 시·도를 지도에서 눌러 주세요. 2~4개까지 고를 수 있어요.");
    else mapHint(`${sel.map(shortOf).join(" · ")} 비교 준비가 됐어요. 위에 질문을 쓰고 비교해 보세요.`);
  }
  async function buildMap() {
    if (MAPD) return;
    try { MAPD = await api("/region_map.json"); } catch { $("#mpSrc").textContent = "지도를 불러오지 못했어요. 목록으로 골라 주세요."; return; }
    const svg = $("#rmap"); svg.innerHTML = "";
    mapVB = [-10, -10, MAPD.w + 40, MAPD.h + 20]; svg.setAttribute("viewBox", mapVB.join(" "));
    const g0 = svgEl("g", {}, svg), gh = svgEl("g", {}, svg), gl = svgEl("g", {}, svg);
    const hi = svgEl("path", { class: "rm-hi" }, gh), tip = $("#rmTip");
    const showTip = (e, n) => { const r = $("#mpWrap").getBoundingClientRect(); tip.textContent = `${n} · ${picks.has(n) ? "누르면 빼기" : "누르면 고르기"}`; tip.style.display = "block"; tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px"; };
    const valid = new Set(state.regions.map(r => r.name));
    MAPD.sido.filter(x => valid.has(x.n)).forEach(x => {
      const p = svgEl("path", { d: x.d, class: "rm-sido", tabindex: "0", role: "button", "aria-label": x.n, "data-n": x.n }, g0);
      p.addEventListener("pointermove", e => showTip(e, x.n));
      p.addEventListener("pointerenter", () => { hi.setAttribute("d", x.d); hi.classList.add("on"); });
      p.addEventListener("pointerleave", () => { tip.style.display = "none"; hi.classList.remove("on"); });
      p.addEventListener("click", e => { toggle(x.n); showTip(e, x.n); });
      p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(x.n); } });
      const c = LABEL_FIX[x.n] || x.c;
      svgEl("text", { x: c[0], y: c[1], class: "rm-lab", "text-anchor": "middle", "dominant-baseline": "middle", "data-n": x.n }, gl).textContent = x.s;
    });
    if (MAPD.dokdo) svgEl("circle", { cx: MAPD.dokdo[0], cy: MAPD.dokdo[1], r: 3.5, class: "rm-dok" }, gl);
    $("#mpSrc").textContent = "지도: " + MAPD.src;
    scaleLabels(); paintMap();
  }
  addEventListener("resize", scaleLabels);
  $("#mpFind").addEventListener("input", e => {
    const q = e.target.value.trim(), box = $("#mpSugg");
    if (!q) { box.style.display = "none"; return; }
    const hits = state.regions.map(r => r.name).filter(n => n.includes(q) || shortOf(n).includes(q));
    box.innerHTML = hits.map(n => `<button type="button" role="option" data-r="${esc(n)}"><span>${esc(n)}</span><small>${picks.has(n) ? "고름 · 누르면 빼기" : "누르면 고르기"}</small></button>`).join("") || `<p style="margin:0;padding:9px 12px;color:var(--mute);font-size:14px">‘${esc(q)}’에 맞는 지역이 없어요</p>`;
    box.style.display = "block";
    box.querySelectorAll("button[data-r]").forEach(b => b.onclick = () => { toggle(b.dataset.r); box.style.display = "none"; e.target.value = ""; });
  });
  document.addEventListener("click", e => { const box = $("#mpSugg"); if (box && !e.target.closest(".mp-find")) box.style.display = "none"; });
  const setPickMode = m => {
    store.set("cmpPickMode", m);
    document.querySelectorAll(".pick-mode button").forEach(b => { b.classList.toggle("on", b.dataset.m === m); b.setAttribute("aria-pressed", b.dataset.m === m); });
    $("#picks").hidden = m === "map"; $("#pickMap").hidden = m !== "map";
    if (m === "map") buildMap().then(() => { scaleLabels(); paintMap(); });
  };
  document.querySelectorAll(".pick-mode button").forEach(b => b.onclick = () => setPickMode(b.dataset.m));
  drawPicks();
  setPickMode(store.get("cmpPickMode", "list") === "map" ? "map" : "list");
  $("#cmpForm").onsubmit = async e => {
    e.preventDefault();
    const q = $("#cmpQ").value.trim();
    if (!q) return;
    if (picks.size < 2) return alert("지역을 2개 이상 골라 주세요");
    const regs = [...picks];
    $("#cmpOut").innerHTML = `<div class="cmp-grid" style="grid-template-columns:repeat(${regs.length},minmax(0,1fr))">${regs.map(r => `<div class="cmp-col"><h3>${esc(shortRegion(r))}</h3><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>`).join("")}</div>`;
    try {
      const out = await api("/api/compare", { method: "POST", body: JSON.stringify({ question: q, regions: regs }) });
      $("#cmpOut").innerHTML = `<div class="summary">${esc(out.summary)}</div>
        <div class="cmp-grid" style="grid-template-columns:repeat(${out.rows.length},minmax(0,1fr))">${out.rows.map(r => `
          <div class="cmp-col"><h3>${esc(shortRegion(r.region))}<span class="badge ${r.found ? "yes" : "no"}">${r.found ? "조례 있음" : "관련 조례 없음"}</span></h3>
            <div style="line-height:1.7">${r.found ? esc(r.answer) : `<span style="color:var(--sub)">${esc(r.region)} 자치법규에서 관련 규정을 찾지 못했어요.</span>`}</div>
            ${r.evidence.length ? evidenceHTML(r.evidence) : ""}
            <div style="font-size:13px;color:var(--mute)">담당: ${esc(r.dept.dept)} ${esc(r.dept.phone || "")} · ${r.sec}초</div>
          </div>`).join("")}</div>
        <div class="card" style="margin-top:18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap">
          <div><b>비교 결과로 조례 제정·개정을 건의할 수 있어요</b><div style="color:var(--sub);font-size:14px;margin-top:4px">다른 지역에 이미 있는 조례를 근거로 민원을 넣어 보세요.</div></div>
          <div style="width:240px"><button class="btn pri" id="cmpTicket">비교 결과로 민원 넣기</button></div></div>`;
      $("#cmpTicket").onclick = () => {
        const yes = out.rows.filter(r => r.found), no = out.rows.filter(r => !r.found);
        const text = `${q}\n\n[지역 비교 결과]\n` + out.rows.map(r => `- ${r.region}: ${r.found ? r.answer : "관련 조례 없음"}`).join("\n");
        const base = no[0] || out.rows[0];
        openTicket({ question: text, region: base.region, title: `${shortRegion(base.region)} 조례 제정·개정 건의`,
          evidence: yes.flatMap(r => r.evidence), laws: yes.flatMap(r => r.laws), dept: base.dept, type: "compare", type_label: "지역 비교", answer: "" });
      };
    } catch (err) { $("#cmpOut").innerHTML = `<div class="card" style="margin-top:20px">${esc(err.message)}</div>`; }
  };
  if (q0) $("#cmpForm").requestSubmit();
}

/* ---------- ticket (citizen) ---------- */
function viewTicket() {
  $("#view").innerHTML = `<div class="page"><div class="wrap">
    <div class="page-head"><div><h1>민원 작성</h1><p>AI가 먼저 관련 조례를 찾아 근거를 붙인 뒤 담당 부서로 보내요. 간단한 질문이면 바로 답도 받아 보세요.</p></div></div>
    <div class="two">
      <div class="card">
        <form id="newTk">
          <label class="fl" style="margin-top:0">지역</label><select class="f" id="tkRegion">${regionOptions(state.region)}</select>
          <label class="fl">민원 내용</label><textarea id="tkText" required placeholder="예) 아파트 앞 공영주차장에 가족배려주차구역이 없는데 설치 기준이 궁금하고, 설치를 건의하고 싶어요."></textarea>
          <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
            <button class="btn sec" style="flex:1" type="button" id="tryAI">먼저 AI 답변 보기</button>
            <button class="btn pri" style="flex:1" id="sendTk">바로 담당자에게 보내기</button></div>
          <p style="font-size:12.5px;color:var(--mute);margin:12px 0 0">개인정보는 자동으로 가려서 저장해요. 시연용이라 실제 기관에는 전달되지 않아요.</p>
        </form>
        <div id="tkStatus"></div>
      </div>
      <div><h3 style="margin:0 0 12px">내 민원</h3><div class="tk-list" id="mine"><div class="skel"></div></div></div>
    </div></div></div>`;
  $("#tkRegion").onchange = e => setRegion(e.target.value);
  $("#tryAI").onclick = () => { const q = $("#tkText").value.trim(); if (q) goAsk(q); };
  $("#newTk").onsubmit = async e => {
    e.preventDefault();
    const q = $("#tkText").value.trim(); if (!q) return;
    $("#sendTk").disabled = true; $("#sendTk").textContent = "근거를 찾는 중…";
    $("#tkStatus").innerHTML = `<p style="color:var(--sub);font-size:14px;margin-top:14px">AI가 관련 조례와 담당 부서를 찾고 있어요…</p>`;
    let result = null;
    try {
      const res = await fetch("/api/ask/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, region: state.region }) });
      const text = await res.text();
      for (const line of text.split("\n")) if (line.trim()) { const ev = JSON.parse(line); if (ev.stage === "answer") result = ev; }
      const t = await api("/api/tickets", { method: "POST", body: JSON.stringify({ question: q, region: state.region, title: result && result.title, result }) });
      const mine = store.get("tickets", []); mine.unshift(t.no); store.set("tickets", mine.slice(0, 50));
      $("#tkText").value = "";
      $("#tkStatus").innerHTML = `<div class="bundle"><b>접수번호 ${esc(t.no)} · ${esc(t.dept.org)} ${esc(t.dept.dept)} 배정</b>근거 조항 ${t.bundle.evidence.length}개와 쟁점 ${t.bundle.issues.length}개를 함께 보냈어요.${timeline(t.status)}</div>`;
      loadMine();
    } catch (err) { $("#tkStatus").innerHTML = `<p style="color:var(--red)">${esc(err.message)}</p>`; }
    $("#sendTk").disabled = false; $("#sendTk").textContent = "바로 담당자에게 보내기";
  };
  loadMine();
}
async function loadMine() {
  const nos = store.get("tickets", []);
  const el = $("#mine"); if (!el) return;
  if (!nos.length) { el.innerHTML = `<div class="empty card">아직 접수한 민원이 없어요.</div>`; return; }
  const rows = await api("/api/tickets?nos=" + nos.join(","));
  el.innerHTML = rows.length ? rows.map(t => `<div class="tk"><div class="row1"><span>${esc(t.no)} · ${esc(t.created.slice(0, 16).replace("T", " "))}</span><span class="st st-${esc(t.status)}">${esc(t.status)}</span></div>
    <h4>${esc(t.title)}</h4><div style="font-size:13.5px;color:var(--sub)">${esc(t.dept.org)} ${esc(t.dept.dept)}</div>${timeline(t.status)}
    ${t.reply ? `<div class="bundle"><b>담당자 답변</b>${esc(t.reply)}</div>` : ""}</div>`).join("") : `<div class="empty card">아직 접수한 민원이 없어요.</div>`;
}

/* ---------- officer ---------- */
let officerSel = null;
async function viewOfficer() {
  $("#view").innerHTML = `<div class="page"><div class="wrap">
    <div class="page-head"><div><h1>담당자 민원함</h1><p>AI가 찾은 근거 조항·답변 초안·쟁점이 미리 정리돼 있어요. 검토·보완해서 답변하세요.</p></div>
      <button class="btn sec" style="width:auto" onclick="viewOfficer()">새로고침</button></div>
    <div class="officer"><div class="tk-list" id="inbox"><div class="skel"></div></div><div id="detail"><div class="card empty">왼쪽에서 민원을 고르세요.</div></div></div>
  </div></div>`;
  const rows = await api("/api/tickets");
  if (!rows.length) { $("#inbox").innerHTML = `<div class="card empty">접수된 민원이 없어요.<br>시민 화면에서 '담당자에게 문의하기'를 눌러 보세요.</div>`; return; }
  $("#inbox").innerHTML = rows.map(t => `<div class="tk ${t.no === officerSel ? "sel" : ""}" data-no="${esc(t.no)}"><div class="row1"><span>${esc(t.no)}</span><span class="st st-${esc(t.status)}">${esc(t.status)}</span></div>
    <h4>${esc(t.title)}</h4><div style="font-size:13px;color:var(--sub)">${esc(t.dept.org)} ${esc(t.dept.dept)} · ${esc(t.bundle.type_label || "직접 접수")}</div></div>`).join("");
  $("#inbox").querySelectorAll(".tk").forEach(el => el.onclick = () => { officerSel = el.dataset.no; showTicket(rows.find(t => t.no === officerSel)); $("#inbox").querySelectorAll(".tk").forEach(x => x.classList.toggle("sel", x === el)); });
  const sel = rows.find(t => t.no === officerSel) || rows[0];
  officerSel = sel.no; showTicket(sel);
  $("#inbox").querySelector(`[data-no="${CSS.escape(sel.no)}"]`).classList.add("sel");
}
function showTicket(t) {
  const b = t.bundle || {};
  $("#detail").innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span class="st st-${esc(t.status)}">${esc(t.status)}</span><span style="font-size:13px;color:var(--mute)">접수 ${esc(t.created.replace("T", " "))}</span></div>
    <h2 style="margin:10px 0 14px;font-size:22px">${esc(t.title)}</h2>
    ${timeline(t.status)}
    <dl class="kv" style="margin-top:18px"><dt>지역</dt><dd>${esc(t.region)}</dd><dt>배정 부서</dt><dd>${esc(t.dept.dept)} ${esc(t.dept.phone || "")}${t.dept.guessed ? ' <span class="guess">추정</span>' : ""}</dd>
      <dt>신청인</dt><dd>${esc(t.name || "익명")}</dd><dt>질문 유형</dt><dd>${b.type_label ? `<span class="badge t-${esc(b.type)}">${esc(b.type_label)}</span>` : "직접 접수"}</dd></dl>
    <div class="ev-title">문의 내용</div><div style="white-space:pre-wrap;line-height:1.7">${esc(t.question)}${t.message ? "\n\n" + esc(t.message) : ""}</div>
    ${b.issues && b.issues.length ? `<div class="ev-title">AI가 정리한 확인할 쟁점</div><ol class="issues">${b.issues.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
    ${b.ai_answer && b.ai_answer !== "확인 불가" ? `<div class="ev-title">AI 답변 초안</div><div class="bundle" style="margin-top:0">${esc(b.ai_answer)}</div>` : ""}
    ${b.evidence && b.evidence.length ? `<div class="ev-title">${ICON.book} 근거 조항 ${b.evidence.length}개</div>${evidenceHTML(b.evidence)}` :
      b.laws && b.laws.length ? `<div class="ev-title">AI가 찾아본 자치법규</div><ul class="mini-laws">${b.laws.map(l => `<li><a href="${esc(l.source_url)}" target="_blank" rel="noopener">${esc(l.name)}</a></li>`).join("")}</ul>` : ""}
    <div class="ev-title" id="replySec">회신문 작성</div>
    <textarea id="reply" placeholder="시민에게 보낼 답변">${esc(t.reply || (b.ai_answer && b.ai_answer !== "확인 불가" ? b.ai_answer : ""))}</textarea>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn sec" style="flex:1" id="btnWork" ${t.status !== "기관지정" ? "disabled" : ""}>처리 시작 (담당자처리중)</button>
      <button class="btn pri" style="flex:1" id="btnReply">답변 등록 (답변완료)</button></div>
  </div>`;
  $("#btnWork").onclick = async () => { await api("/api/tickets/" + t.no, { method: "PATCH", body: JSON.stringify({ status: "담당자처리중" }) }); viewOfficer(); };
  $("#btnReply").onclick = async () => {
    const reply = $("#reply").value.trim(); if (!reply) return alert("답변을 입력해 주세요");
    await api("/api/tickets/" + t.no, { method: "PATCH", body: JSON.stringify({ reply }) }); viewOfficer();
  };
  railSpy();
}

    <div class="g-sec"><h2>법 문장 표현 구분</h2><p>근거 조항에 이런 표현이 있으면 표시해 드려요. 표시에 마우스를 올리면 뜻이 보여요.</p>

        <tr><td>답변 근거</td><td>담당자 답변에 따라 다름</td><td>모든 답변에 조례명·조항·원문 표시</td></tr></table></div>
    <div class="notice">AI 답변은 공식 행정 답변이 아닌 참고용 안내예요. 조례 원문은 국가법령정보센터 현행 자치법규 기준이며, 답변에 시행일을 함께 표시해요. 질문 속 전화번호·차량번호 같은 개인정보는 자동으로 가려서 처리해요.</div>

/* ---------- floating rail (주황색 = 지금 보고 있는 화면·위치) ---------- */
const RAIL_ICON = {
  ask: '<path d="M4 5h16v11H8l-4 4V5z"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  case: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  doc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
};
function railItem(key, label, icon, attrs) {
  return `<a ${attrs} data-rail="${key}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${RAIL_ICON[icon]}</svg>${label}</a>`;
}
let railPage = "home";
function renderRail(p) {
  railPage = p;
  const officer = p === "/officer";
  const top = `<button onclick="window.scrollTo({top:0})"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${RAIL_ICON.up}</svg>맨 위로</button>`;
  $("#rail").innerHTML = officer
    ? railItem("review", "민원<br>검토", "doc", 'href="#/officer" data-scroll="#inbox"') + railItem("reply", "회신문", "pen", 'href="#/officer" data-scroll="#replySec"')
      + "<hr>" + railItem("citizen", "시민<br>모드로", "user", 'href="#/"') + top
    : railItem("ask", "질문하기", "ask", 'href="#/"') + railItem("compare", "지역 비교", "map", 'href="#/compare"') + railItem("ticket", "민원 작성", "pen", 'href="#/ticket"')
      + "<hr>" + railItem("officer", "공무원<br>모드로", "case", 'href="#/officer"') + top;
  $("#rail").querySelectorAll("[data-scroll]").forEach(a => a.onclick = e => {
    const el = $(a.dataset.scroll); if (!el) return;
    e.preventDefault();
    window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 90 });
  });
  railSpy();
}
function railSpy() {
  let on = null;
  if (railPage === "/officer") {
    const r = $("#replySec");
    const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
    on = r && (r.getBoundingClientRect().top < innerHeight * 0.55 || atBottom) ? "reply" : "review";
  } else {
    on = { "/": "ask", "/ask": "ask", "/compare": "compare", "/ticket": "ticket" }[railPage] || null;
  }
  $("#rail").querySelectorAll("[data-rail]").forEach(a => a.classList.toggle("hot", a.dataset.rail === on));
}

/* 상단 메뉴줄: 아래로 스크롤하면 숨기고, 위로 스크롤하면 다시 보임 */
let lastY = scrollY;
addEventListener("scroll", () => {
  const y = scrollY, hdr = $("#hdr");
  if (!hdr.classList.contains("open")) {
    if (y > lastY && y > 80) hdr.classList.add("hide");
    else if (y < lastY) hdr.classList.remove("hide");
  }
  lastY = y;
  railSpy();
}, { passive: true });

/* ---------- router ---------- */
function setMode(m) { document.querySelectorAll(".mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === m)); }
document.querySelectorAll(".mode button").forEach(b => b.onclick = () => { location.hash = b.dataset.mode === "officer" ? "#/officer" : "#/"; });
function route() {
  const [path, qs] = location.hash.replace(/^#/, "").split("?");
  const params = new URLSearchParams(qs || "");
  const p = path || "/";
  $("#hdr").classList.remove("open");
  closeModal();
  document.querySelectorAll("nav.main a").forEach(a => a.classList.toggle("on", "/" + (a.dataset.nav === "home" ? "" : a.dataset.nav) === p || (p === "/ask" && a.dataset.nav === "home")));
  setMode(p === "/officer" ? "officer" : "citizen");
  window.scrollTo({ top: 0 });
  $("#hdr").classList.remove("hide");
  renderRail(p);
  if (p === "/ask") viewAsk(params);
  else if (p === "/compare") viewCompare(params);
  else if (p === "/law") viewLaw(params);
  else if (p === "/ticket") viewTicket();
  else if (p === "/guide") viewGuide();
  else if (p === "/officer") viewOfficer();
  else viewHome();
}
(async () => {
  try { state.regions = await api("/api/regions"); } catch { state.regions = [{ name: "서울특별시", group: "시·도" }]; }
  if (!state.regions.some(r => r.name === state.region)) setRegion("서울특별시");
  window.addEventListener("hashchange", route);
  route();
})();
</script>
